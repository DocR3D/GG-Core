# ==============================================================================
# SonarQube Cloud configuration for GG-Core Backend
# ==============================================================================

sonar.projectKey=DocR3D_GG-Core
sonar.organization=docr3d
sonar.projectName=GG-Core Backend
sonar.projectVersion=1.0.0

# Source & Test scoping (relative to backend/)
sonar.sources=src
sonar.tests=src
sonar.test.inclusions=src/**/*.spec.ts
sonar.exclusions=**/node_modules/**,**/dist/**,**/coverage/**,public/**,scripts/**
# Entry points: the server bootstrap and the command line wrappers are exercised end to end (the tournament scenario in CI), not by unit tests
# DTOs: classes that only describe data (read by the contract and the validation pipe), with no logic to run; their rules are tested where they matter
sonar.coverage.exclusions=src/main.ts,src/**/*.cli.ts,src/**/dto/**

# Encoding
sonar.sourceEncoding=UTF-8

# Code Coverage (relative to backend/)
sonar.javascript.lcov.reportPaths=coverage/lcov.info
