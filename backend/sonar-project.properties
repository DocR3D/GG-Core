# ==============================================================================
# SonarQube Cloud configuration for GG-Core Backend
# ==============================================================================

sonar.projectKey=DocR3D_GG-Core
sonar.organization=docr3d
sonar.projectName=GG-Core Backend
sonar.projectVersion=1.0.0

# Source & Test scoping (relative to backend/)
sonar.sources=src
sonar.tests=src
sonar.test.inclusions=src/**/*.spec.ts
sonar.exclusions=**/node_modules/**,**/dist/**,**/coverage/**,public/**,scripts/**

# Encoding
sonar.sourceEncoding=UTF-8

# Code Coverage (relative to backend/)
sonar.javascript.lcov.reportPaths=coverage/lcov.info
