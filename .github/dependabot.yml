# Weekly dependency updates, one pull request per ecosystem and folder with the minor and patch bumps grouped.
# Major versions arrive as their own pull request: NestJS 11/12 (with Express 5) and Prisma 7 are planned migrations,
# close those pull requests until the migration is scheduled. Security updates are opened right away, outside this
# schedule. Pull requests run the CI like any other: "CI OK" must pass before merging.
version: 2

updates:
  - package-ecosystem: npm
    directory: /backend
    schedule: { interval: weekly, day: monday }
    open-pull-requests-limit: 5
    commit-message: { prefix: "chore(deps)" }
    groups:
      backend-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: gomod
    directory: /agent
    schedule: { interval: weekly, day: monday }
    open-pull-requests-limit: 5
    commit-message: { prefix: "chore(deps)" }
    groups:
      agent-minor-patch:
        update-types: [minor, patch]

  # Base images of the Dockerfiles (root, backend, infra, tools).
  - package-ecosystem: docker
    directories: [/, /backend, /infra, /tools/log-drain]
    schedule: { interval: weekly, day: monday }
    open-pull-requests-limit: 5
    commit-message: { prefix: "chore(deps)" }

  # Images of the compose files (Redis, PostgreSQL).
  - package-ecosystem: docker-compose
    directory: /infra
    schedule: { interval: weekly, day: monday }
    open-pull-requests-limit: 3
    commit-message: { prefix: "chore(deps)" }

  # The actions of the workflows are pinned by commit: Dependabot moves the pin and the version comment together.
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly, day: monday }
    open-pull-requests-limit: 3
    commit-message: { prefix: "chore(ci)" }
    groups:
      actions:
        patterns: ["*"]
