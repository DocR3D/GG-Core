name: CI

# One workflow for the whole repository. Each job decides from the files a pull request touches whether it has to run
# (job "changes"), and "CI OK" sums everything up: it is the only check branch protection has to require. A job that is
# skipped counts as passed, so a pull request that only touches docs is not blocked waiting for a check that never runs.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

# A new push to a pull request cancels the run in progress; runs on main always go to the end.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------------
  # What does this change touch?
  # ---------------------------------------------------------------------------
  changes:
    name: What changed
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      agent: ${{ steps.filter.outputs.agent }}
      lint: ${{ steps.filter.outputs.lint }}
      images: ${{ steps.filter.outputs.images }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2 # a pull request is checked out as a merge commit: HEAD^1 is the tip of main

      - id: filter
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            files="$(git diff --name-only HEAD^1 HEAD)"
          else
            files="" # push to main: everything runs
          fi
          echo "Changed files:"; echo "$files"
          # Everything runs on main, and when the workflow itself changes.
          all=false
          if [ -z "$files" ] || echo "$files" | grep -q '^\.github/workflows/ci\.yml$'; then all=true; fi
          has() { [ "$all" = true ] || echo "$files" | grep -Eq "$1"; }
          {
            echo "backend=$(has '^(backend/|test/|infra/)' && echo true || echo false)"
            echo "agent=$(has '^agent/' && echo true || echo false)"
            echo "lint=$(has '(^|/)(Dockerfile[^/]*|[^/]*\.sh)$|^infra/|^scripts/' && echo true || echo false)"
            echo "images=$(has '(^|/)Dockerfile[^/]*$|^infra/|^tools/log-drain/|^agent/|^backend/(package|prisma)' && echo true || echo false)"
          } | tee -a "$GITHUB_OUTPUT"

  # ---------------------------------------------------------------------------
  # Backend: typecheck, lint, unit tests + Golden Master, PostgreSQL tests, build, SonarQube
  # ---------------------------------------------------------------------------
  backend:
    name: Typecheck, Lint, Test & SonarQube Coverage
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }} # empty on pull requests from forks and from Dependabot: the scan is skipped

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ggcore_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # Full history required for SonarQube analysis

      - name: Cache SonarQube packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar

      - name: Setup Node.js 26
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        working-directory: ./backend
        run: npm ci

      - name: Generate Prisma Client
        working-directory: ./backend
        run: npx prisma generate

      - name: 1. Strict Typecheck (tsc --noEmit)
        working-directory: ./backend
        run: npm run typecheck

      - name: 2. Lint (ESLint 9 + typed rules)
        working-directory: ./backend
        run: npm run lint

      # One run for everything, PostgreSQL specs included, so that the coverage sent to Sonar counts what they
      # cover (the tournament services are tested almost only by them: 5-11% without, 83-91% with).
      - name: 3. Unit, Golden Master and real PostgreSQL tests with Coverage (LCOV)
        working-directory: ./backend
        env:
          DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/ggcore_ci?schema=public"
          DB_IT: "1"
        run: |
          npx prisma db push --skip-generate
          npm run test:coverage

      - name: 4. Build NestJS Backend
        working-directory: ./backend
        run: npm run build

      # The API contract only gets more complete: the routes not described yet are listed in backend/openapi-gaps.json. A route
      # outside the list must have no gap, and a route of the list that has none must leave it (npm run openapi:check -- --update).
      - name: 4b. API contract completeness
        working-directory: ./backend
        run: node dist/tools/export-openapi.cli.js && node dist/tools/check-openapi-completeness.cli.js

      # Informative: the production vulnerabilities left need major upgrades (NestJS 11/12 with Express 5, Prisma 7).
      - name: 5. Dependency audit (production, informative)
        working-directory: ./backend
        continue-on-error: true
        run: npm audit --omit=dev --audit-level=high

      # Sonar judges the coverage of the lines only. Jest also counts "branches" that TypeScript writes itself for the
      # decorators of NestJS (one type test per typed parameter, whose "class missing" side never runs): no test can
      # cover them, and they pulled a fully tested controller under the 80% of the gate. The branch counts stay in the
      # Jest report, to find a real untested case when writing tests.
      - name: 6. Coverage for Sonar (lines only)
        working-directory: ./backend
        run: sed -i '/^BRDA:/d;/^BRF:/d;/^BRH:/d' coverage/lcov.info

      - name: 7. SonarQube Cloud Scan
        uses: SonarSource/sonarqube-scan-action@e805d875275f728fac1885b413934be6d7c63f65 # v8.4.1
        if: env.SONAR_TOKEN != ''
        with:
          projectBaseDir: backend # sonar-project.properties lives there, its paths are relative to it
          # On a pull request, a failed quality gate fails the job (the gate only looks at the new code).
          args: ${{ github.event_name == 'pull_request' && '-Dsonar.qualitygate.wait=true' || '' }}

  # ---------------------------------------------------------------------------
  # Full tournament scenario on a real backend, PostgreSQL and Redis (what `make e2e-tournament` plays locally)
  # ---------------------------------------------------------------------------
  e2e-tournament:
    name: End-to-end tournament scenario
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/ggcore_e2e?schema=public"
      REDIS_URL: "redis://localhost:6379"
      # Values for this throwaway backend only (it lives for the duration of the job and listens on localhost).
      JWT_SECRET: ci-e2e-secret
      GG_ADMIN_TOKEN: ci-e2e-admin-token
      GG_ADMIN_PASSWORD: ci-e2e-password
      GG_ADMIN_STEAMIDS: "76561190000000001"
      TRUST_PROXY: loopback
      PORT: "8081"
      WS_PATH: /ws
      NODE_ENV: development
      # the scenario uses the Sandbox, which exists in dev and rec only
      GG_ENV: dev

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ggcore_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install, generate, create the schema, build
        working-directory: ./backend
        run: |
          npm ci
          npx prisma generate
          npx prisma db push --skip-generate
          npm run build

      - name: Start the backend
        working-directory: ./backend
        run: |
          nohup node dist/main.js > "$RUNNER_TEMP/backend.log" 2>&1 &
          for i in $(seq 1 60); do
            [ "$(curl -s -m 2 -o /dev/null -w '%{http_code}' localhost:8081/api/health)" = 200 ] && { echo "backend up after ${i} tries"; exit 0; }
            sleep 2
          done
          echo "backend did not answer on /api/health"; tail -50 "$RUNNER_TEMP/backend.log"; exit 1

      - name: Play the tournament scenario
        working-directory: ./backend
        run: node scripts/e2e-tournament.mjs

      - name: Backend log (on failure)
        if: failure()
        run: tail -150 "$RUNNER_TEMP/backend.log"

  # ---------------------------------------------------------------------------
  # Go agent and manager
  # ---------------------------------------------------------------------------
  agent:
    name: Go agent (build, vet, tests)
    needs: changes
    if: needs.changes.outputs.agent == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: agent/go.mod
          cache-dependency-path: agent/go.sum

      - name: Build
        working-directory: ./agent
        run: go build ./...

      - name: Vet
        working-directory: ./agent
        run: go vet ./...

      - name: Tests
        working-directory: ./agent
        run: go test ./...

  # ---------------------------------------------------------------------------
  # Dockerfiles (errors only: style warnings such as unpinned apk packages are not blocking) and shell scripts
  # (warnings and errors: the "info" notes depend on the shellcheck version of the runner, e.g. SC2015 on `A && B || C`)
  # ---------------------------------------------------------------------------
  lint-docker-shell:
    name: Dockerfiles and shell scripts
    needs: changes
    if: needs.changes.outputs.lint == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Shellcheck
        run: git ls-files -z '*.sh' | xargs -0 --no-run-if-empty shellcheck --severity=warning

      - name: Hadolint
        run: |
          status=0
          for f in $(git ls-files | grep -E '(^|/)Dockerfile[^/]*$'); do
            echo "== $f"
            docker run --rm -i hadolint/hadolint:v2.12.0 hadolint --failure-threshold error - < "$f" || status=1
          done
          exit $status

  # ---------------------------------------------------------------------------
  # Docker images that the dev stack builds (hadolint only reads the Dockerfiles: a base image that no longer builds
  # would otherwise show up only when somebody starts the stack). Build only, nothing is pushed.
  # The root Dockerfile and docker-compose.monolith.yml are not built: they copy folders that no longer exist.
  # ---------------------------------------------------------------------------
  docker-build:
    name: Docker images build
    needs: changes
    if: needs.changes.outputs.images == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Backend (dev image of the compose stack)
        run: docker build -f backend/Dockerfile.nest.dev -t ggcore-backend-dev backend

      - name: Agent and manager (Go)
        run: docker build -f infra/Dockerfile -t ggcore-agent .

      - name: Log drain (dev tool)
        run: docker build -t ggcore-log-drain tools/log-drain

  # ---------------------------------------------------------------------------
  # The one check to require before merging
  # ---------------------------------------------------------------------------
  ci-ok:
    name: CI OK
    needs: [changes, backend, e2e-tournament, agent, lint-docker-shell, docker-build]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Every job that had to run passed
        run: |
          echo '${{ toJSON(needs) }}'
          if echo '${{ toJSON(needs.*.result) }}' | grep -Eq 'failure|cancelled'; then
            echo "a job failed or was cancelled"; exit 1
          fi
