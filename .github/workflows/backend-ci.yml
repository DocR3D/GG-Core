name: Backend CI & SonarQube

on:
  push:
    branches:
      - main
      - new-main
      - 'feat/**'
      - 'ci/**'
    paths:
      - 'backend/**'
      - 'infra/**'
      - '.github/workflows/backend-ci.yml'
      - 'sonar-project.properties'
  pull_request:
    branches:
      - main
      - new-main
    paths:
      - 'backend/**'
      - 'infra/**'
      - '.github/workflows/backend-ci.yml'
      - 'sonar-project.properties'

jobs:
  backend-quality-and-tests:
    name: Typecheck, Lint, Test & Coverage
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ggcore_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Full history required for SonarQube analysis

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        working-directory: ./backend
        run: npm ci

      - name: Generate Prisma Client
        working-directory: ./backend
        run: npx prisma generate

      - name: 1. Strict Typecheck (tsc --noEmit)
        working-directory: ./backend
        run: npm run typecheck

      - name: 2. Lint (ESLint 9 + typed rules)
        working-directory: ./backend
        run: npm run lint

      - name: 3. Unit Tests & Golden Master with Coverage (LCOV)
        working-directory: ./backend
        run: npm run test:coverage

      - name: 4. Real PostgreSQL Integration Tests
        working-directory: ./backend
        env:
          DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/ggcore_ci?schema=public"
          DB_IT: "1"
        run: |
          npx prisma db push --skip-generate
          npx jest --config jest.config.ts db.spec

      - name: 5. Build NestJS Backend
        working-directory: ./backend
        run: npm run build

      - name: 6. SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@v4
        if: env.SONAR_TOKEN != ''
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
