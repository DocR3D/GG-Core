// =====================================================
// 🧹 Fix post-knife → retour compétitif propre
// À exécuter juste avant LIVE_MAIN
// =====================================================

echo "=== GGBot: applying competitive defaults after knife ==="

// 2) Nettoyage des verrous posés par le knife.cfg

// — achats & argent
mp_startmoney 800
mp_buytime 20
mp_maxmoney 16000
mp_buy_anywhere 0
mp_buy_allow_grenades 1

// — temps de freeze / rounds / overtime
mp_freezetime 15
mp_roundtime 0               // on laisse à 0 et on pilote via _defuse
mp_roundtime_defuse 1.92     // ≈ 1:55 (compétitif)
mp_overtime_enable 1

// — C4 & armes placées sur la map
mp_give_player_c4 1
mp_weapons_allow_map_placed 1

// — catégories d’armes (dans le knife.cfg tu avais tout coupé)
mp_weapons_allow_knife -1
mp_weapons_allow_pistols -1
mp_weapons_allow_rifles -1
mp_weapons_allow_heavy -1
mp_weapons_allow_grenades -1
mp_weapons_allow_equipment -1

// — interdictions explicites (vide la liste posée par mp_items_prohibited)
mp_items_prohibited ""

// — pistolets par défaut (rétablis un setup compétitif standard)
//   Choisis l’un des deux pour CT :
mp_ct_default_secondary "weapon_usp_silencer"
// mp_ct_default_secondary "weapon_hkp2000"
mp_t_default_secondary "weapon_glock"