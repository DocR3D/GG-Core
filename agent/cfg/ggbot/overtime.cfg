// ===== GGBot / GGLan - CS2 Overtime Config (Valve MR3) =====
mp_overtime_enable 1
// Overtimes until there is a winner (Valve rules). gamemode_competitive_tmm.cfg, run at live start,
// sets the matchmaking value 1: the match ended as a DRAW after OT1 (seen on a real server).
mp_overtime_limit 0
mp_overtime_maxrounds 6
mp_overtime_startmoney 10000
mp_overtime_halftime_pausetimer 0

// Timeouts en prolongation (règlement Valve Supplemental Rulebook)
mp_team_timeout_ot_add_once 1
mp_team_timeout_ot_add_each 1
mp_team_timeout_ot_max 1
