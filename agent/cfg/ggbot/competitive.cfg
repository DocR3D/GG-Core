// =====================================================
// Settings compétitifs — appliqués avant tout LIVE_MAIN
// Après knife (map décisive) ou directement (maps non-décisives)
// =====================================================

echo "=== GGBot: competitive settings ==="

// Achats & argent

// - achats & argent
mp_startmoney 800
mp_buytime 20
mp_maxmoney 16000
mp_buy_anywhere 0
mp_buy_allow_grenades 1

// - temps de freeze / rounds / overtime
mp_freezetime 15
mp_roundtime 0               // on laisse à 0 et on pilote via _defuse
mp_roundtime_defuse 1.92     // ≈ 1:55 (compétitif)
// mp_overtime_enable : géré dynamiquement par l'agent Go (lit match:{id}:config.overtimeEnabled)

// - C4 & armes placées sur la map
mp_give_player_c4 1
mp_weapons_allow_map_placed 1

// - catégories d’armes (dans le knife.cfg tu avais tout coupé)
mp_weapons_allow_knife -1
mp_weapons_allow_pistols -1
mp_weapons_allow_rifles -1
mp_weapons_allow_heavy -1
mp_weapons_allow_grenades -1
mp_weapons_allow_equipment -1

// - interdictions explicites (vide la liste posée par mp_items_prohibited)
mp_items_prohibited ""

// - pistolets par défaut (rétablis un setup compétitif standard)
//   Choisis l’un des deux pour CT :
mp_ct_default_secondary "weapon_usp_silencer"
// mp_ct_default_secondary "weapon_hkp2000"
mp_t_default_secondary "weapon_glock"

mp_autokick 0
mp_suicide_penalty 0
mp_td_dmgtowarn 0
mp_td_dmgtokick 0
mp_spawnprotectiontime 0

echo "=== OVERTIME SETTINGS ==="

// mp_overtime_enable : envoyé par l'agent Go après lecture de match:{id}:config.overtimeEnabled
mp_overtime_maxrounds 6        // MR3 (6 rounds) — constante, on/off géré par l'agent
mp_overtime_startmoney 10000   // money reset OT — constante
mp_overtime_limit 0


sv_allow_votes 0
mp_endmatch_votenextmap 0


mp_match_end_restart 0