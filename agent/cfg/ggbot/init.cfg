echo "=== GGBot Init Map / Training Wait Mode ==="

// ------------------------
// Changement de map
// ------------------------
changelevel ${map}

@sleep 3000

// ------------------------
// Warmup / attente infinie
// ------------------------
mp_warmup_start
mp_warmup_pausetimer 1
mp_warmuptime 999999
mp_warmuptime_all_players_connected 0

// ------------------------
// Parametres serveur
// ------------------------
mp_timelimit 0
mp_autoteambalance 0
mp_limitteams 0
mp_freezetime 0
mp_round_restart_delay 3
mp_buytime 9999
mp_buy_anywhere 1
mp_startmoney 65535
mp_maxmoney 65535
mp_roundtime 60
mp_roundtime_defuse 60

mp_autokick 0
mp_suicide_penalty 0
mp_td_dmgtowarn 0
mp_td_dmgtokick 0
mp_spawnprotectiontime 0


// ------------------------
// Entrainement simple
// ------------------------
bot_kick

// ------------------------
// Messages
// ------------------------
say "========================================"
say "Serveur en mode entrainement / attente."
say "Warmup infini actif."
say "Tapez !rdy quand vous etes prets."
say "Le lancement auto necessite un plugin."
say "========================================"

// Petit restart propre
mp_restartgame 1
