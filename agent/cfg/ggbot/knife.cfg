// =====================================================
// 🔪 Knife Round Only - 1 round, knives only
// =====================================================
echo "=== GGBot Knife Round ==="

// Fin de warmup, reset clair
mp_warmup_end 1

// Temps de freeze court (5s)
mp_freezetime 5

// Durée du round = 5 minutes
mp_roundtime 5
mp_roundtime_defuse 5

// Pas d'overtime automatique
mp_overtime_enable 0

// Argent nul → pas d'achat
mp_startmoney 0
mp_buytime 0
mp_maxmoney 0

// Forcer couteaux uniquement sur les spawns
mp_ct_default_secondary ""
mp_t_default_secondary ""
mp_ct_default_primary ""
mp_t_default_primary ""
mp_ct_default_grenades ""
mp_t_default_grenades ""
mp_give_player_c4 0
mp_weapons_allow_map_placed 0

// Restriction bots
bot_knives_only 1

// Interdire tout achat
mp_items_prohibited "weapon_glock;weapon_usp_silencer;weapon_hkp2000;weapon_deagle;weapon_p250;weapon_ak47;weapon_m4a1;weapon_m4a1_silencer;weapon_awp"

// Redémarrage immédiat
mp_restartgame 1

say "⚔️ Knife round starting - KNIVES ONLY!"
