// =====================================================
// 🔪 Knife Round Only — 1 round, 5 minutes
// =====================================================

echo "=== GGBot Knife Round (5min) ==="

// Fin de warmup, reset clair
mp_warmup_end
mp_restartgame 1
@sleep 1500

// Temps de freeze court (3s pour laisser le suspense)
mp_freezetime 7

// Durée du round = 5 minutes
mp_roundtime 5
mp_roundtime_defuse 5

// Pas d’overtime automatique
mp_overtime_enable 0

// Argent nul → pas d’achat
mp_startmoney 0
mp_buytime 0
mp_maxmoney 0

// Armes limitées (pas d’achats)
mp_items_prohibited "weapon_*"     // interdit tout achat
mp_give_player_c4 0                // pas de C4
mp_weapons_allow_map_placed 0      // ignore les armes placées sur la map

// Pour forcer couteaux uniquement (si dispo dans ta version CS2)
mp_weapons_allow_knife 1
mp_weapons_allow_pistols 0
mp_weapons_allow_rifles 0
mp_weapons_allow_heavy 0
mp_weapons_allow_grenades 0
mp_weapons_allow_equipment 0

mp_items_prohibited "weapon_glock;weapon_usp_silencer;weapon_hkp2000"

// Message aux joueurs
say "⚔️ Knife round starting — 1 round, 5 minutes!"
