// ===== GGBot / GGLan - CS2 Warmup Config =====
mp_warmup_start
mp_warmuptime 999999
mp_warmup_pausetimer 1
mp_warmuptime_all_players_connected 0
mp_buytime 99999
mp_buy_anywhere 1
mp_startmoney 16000
mp_maxmoney 16000
mp_free_armor 2
mp_respawn_on_death_t 1
mp_respawn_on_death_ct 1
mp_death_drop_gun 1
mp_autoteambalance 0
mp_limitteams 0
sv_infinite_ammo 0
mp_friendlyfire 0

// Pas de vote de la prochaine map a la fin du match : les maps viennent du veto (convar verifie dans le dump officiel)
mp_endmatch_votenextmap 0

// Intermission de fin de match de 130 s : la GOTV est retardee (tv_delay jusqu'a 120 s) et CS2 redemarre la partie
// a la fin de l'intermission, ce qui coupe la diffusion retardee : avant, la demo perdait le dernier round.
mp_match_restart_delay 130
