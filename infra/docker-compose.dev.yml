services:
  redis:
    image: redis:7-alpine
    container_name: ggcore-redis-dev
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 1s
      retries: 10

  backend:
    build:
      context: ../backend            # chemins relatifs au fichier compose (infra/)
      dockerfile: Dockerfile.nest.dev
    volumes:
      - ../backend:/app
      - /app/node_modules            # volume anonyme pour ne pas écraser les deps
    environment:
      PORT: "8081"
      WS_PATH: "/ws"
      JWT_SECRET: "dev-change-me"
      REDIS_URL: "redis://redis:6379"
      SERVER_IDS: "srv-a"
      USE_HTTP_PARSE: "false"
      CORS_ORIGIN: "http://localhost:3000"
      CHOKIDAR_USEPOLLING: "1"
      WATCHPACK_POLLING: "true"
    depends_on:
      redis:
        condition: service_healthy
    ports:
      - "8081:8081"

  manager:
    build:
      context: ..
      dockerfile: infra/Dockerfile
    container_name: ggbot-manager
    depends_on:
      redis:
        condition: service_healthy
    volumes:
    # Mount your agents directory from host → container
      - ../agents.d:/etc/ggbot/agents.d:ro
    command: ["-agents-dir","/etc/ggbot/agents.d",
      "-agent-bin","/app/agentd",
      "-redis","redis://redis:6379"]
    # Expose the agents' /logs ports on the host. Adjust to match your YAMLs.
    ports:
      - "8082:8082" # srv-a logs.bind must be 0.0.0.0:8082
      - "8083:8083" # srv-b logs.bind must be 0.0.0.0:8083 (example)
    restart: unless-stopped


  log-drain:
    build:
      context: ../tools/log-drain   # <- vérifie le chemin depuis le dossier du compose
      dockerfile: Dockerfile
    environment:
      REDIS_URL: redis://redis:6379
      REDIS_PATTERN: ggbot:*
      LOG_FILE: /var/log/ggbot/redis-events.jsonl
    volumes:
      - ./logs:/var/log/ggbot       # ./logs relatif au fichier compose
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped


