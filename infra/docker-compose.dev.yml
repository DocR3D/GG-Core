services:
  redis:
    image: redis:7-alpine
    container_name: ggcore-redis-dev
    ports:
      - "6379:6379"

  backend:
    build:
      context: ../backend            # chemins relatifs au fichier compose (infra/)
      dockerfile: Dockerfile.nest.dev
    volumes:
      - ../backend:/app
      - /app/node_modules            # volume anonyme pour ne pas écraser les deps
    environment:
      PORT: "8081"
      WS_PATH: "/ws"
      JWT_SECRET: "dev-change-me"
      REDIS_URL: "redis://redis:6379"
      CORS_ORIGIN: "http://localhost:3000"
      CHOKIDAR_USEPOLLING: "1"
      WATCHPACK_POLLING: "true"
    ports:
      - "8081:8081"

  agent:
    build:
      context: ../agent
      dockerfile: ../Dockerfile.agent.dev
    container_name: ggcore-agent-dev
    working_dir: /app
    # Monte tout parser (code + config.yaml)
    volumes:
      - ../agent:/app
      # environment:
      # si ton agent lit Redis dans config.yaml ignore ceci
      # sinon, tu peux aussi injecter une URL:
      # REDIS_URL: redis://redis:6379
    depends_on:
      - redis
    restart: unless-stopped

    
  log-drain:
    build:
      context: ../tools/log-drain   # <- vérifie le chemin depuis le dossier du compose
      dockerfile: Dockerfile
    environment:
      REDIS_URL: redis://redis:6379
      REDIS_PATTERN: ggbot:*
      LOG_FILE: /var/log/ggbot/redis-events.jsonl
    volumes:
      - ./logs:/var/log/ggbot       # ./logs relatif au fichier compose
    depends_on: [redis]
    restart: unless-stopped


