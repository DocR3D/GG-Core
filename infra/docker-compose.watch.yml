# =============================================================================
# GG-Core — Watch mode
#
# À chaque modification dans backend/src/ ou package.json :
#   → rebuild de l'image Docker  (npm run build via Dockerfile.ci)
#   → restart automatique du container
#
# Usage :
#   # Premier démarrage
#   docker compose -f infra/docker-compose.watch.yml up --build
#
#   # Activer le watch (dans un autre terminal)
#   docker compose -f infra/docker-compose.watch.yml watch
# =============================================================================

services:
  redis:
    image: redis:7-alpine
    container_name: ggcore-redis-watch
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 1s
      retries: 10

  postgres:
    image: postgres:16-alpine
    container_name: ggcore-postgres-watch
    environment:
      POSTGRES_USER: ggcore
      POSTGRES_PASSWORD: ggcore
      POSTGRES_DB: ggcore
    ports:
      - "5432:5432"
    volumes:
      - postgres_data_watch:/var/lib/postgresql/data
      - ./sql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ggcore"]
      interval: 3s
      timeout: 1s
      retries: 10

  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile.ci   # réutilise le multi-stage existant
      target: runtime             # stage final : node dist/main.js
    container_name: ggcore-backend-watch
    environment:
      NODE_ENV: production
      PORT: "8081"
      WS_PATH: "/ws"
      JWT_SECRET: "dev-change-me"
      REDIS_URL: "redis://redis:6379"
      DATABASE_URL: "postgresql://ggcore:ggcore@postgres:5432/ggcore"
      SERVER_IDS: "srv-a"
      USE_HTTP_PARSE: "false"
      CORS_ORIGIN: "http://localhost:3000"
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    ports:
      - "8081:8081"
    restart: unless-stopped
    develop:
      watch:
        # Changements sources → rebuild image + restart container
        - action: rebuild
          path: ../backend/src
        # Changement deps → rebuild image + restart container
        - action: rebuild
          path: ../backend/package.json

volumes:
  postgres_data_watch:
