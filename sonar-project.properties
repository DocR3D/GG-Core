# ==============================================================================
# SonarQube / SonarCloud configuration for GG-Core Backend
# ==============================================================================

# Project identification
sonar.projectKey=gg-core-backend
sonar.projectName=GG-Core Backend
sonar.projectVersion=1.0.0

# Source & Test scoping
sonar.sources=backend/src
sonar.tests=backend/src
sonar.test.inclusions=backend/src/**/*.spec.ts
sonar.exclusions=**/node_modules/**,**/dist/**,**/coverage/**,backend/public/**,backend/scripts/**

# Encoding
sonar.sourceEncoding=UTF-8

# Code Coverage (LCOV format generated by Jest via `npm run test:coverage`)
sonar.javascript.lcov.reportPaths=backend/coverage/lcov.info
