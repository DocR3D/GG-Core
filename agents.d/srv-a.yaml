# Agent config for CS2 server "srv-a". ${VAR:-default} references are expanded from the environment:
# defaults target a native (127.0.0.1) setup, docker-compose overrides them with service names.
version: 1
serverId: srv-a

cs2:
  addr: "${GG_CS2_HOST:-127.0.0.1}"
  port: ${GG_CS2_PORT:-27015}
  rconPassword: "${GG_RCON_PASSWORD:-123456}"
  rcon:
    connectTimeoutMs: 2000
    commandTimeoutMs: 2000
    rateLimitPerSec: 6

cstv:
  enabled: false
  port: 27020

logs:
  bind: "0.0.0.0:8082"
  token: "${GG_LOGS_TOKEN:-tonSuperSecret}"
  backendPostUrl: "${GG_BACKEND_URL:-http://127.0.0.1:8081}/cs2/logs"
  batch:
    maxLines: 100
    maxDelayMs: 75
    maxBytes: 65536
  retry:
    baseMs: 200
    maxMs: 5000
    jitter: true
    maxBufferLines: 10000

redis:
  url: "${GG_REDIS_URL:-redis://127.0.0.1:6379}"
  actionsChannel: "ggbot:agent:srv-a:actions"
  stateKey: "ggbot:agent:srv-a:state"
  stateTtlSec: 10
